backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 5;
shadow-opacity = 0.10;
shadow-offset-x = -3;
shadow-offset-y = -6;
shadow-color = "#000000";

fading = true;
fade-in-step = 0.045;
fade-out-step = 0.045;

corner-radius = 7;
round-borders = 1;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'dmenu'",
  "class_g = 'clipmenu'",
  "class_g = 'j4-dmenu-desktop'"
];

inactive-opacity-override = false;
detect-client-opacity = true;

blur-method = "dual_kawase";
blur-strength = 8;
