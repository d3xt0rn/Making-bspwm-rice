[colors]
background = #282c34
background-alt = #5c6370
foreground = #abb2bf
primary = #abb2bf
secondary = #5c6370
alert = #e06c75
disabled = #5c6370

[bar/main]
width = 100%
height = 14pt
radius = 0
module-padding = 0
dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #282c34

padding-left = 0
padding-right = 1

module-margin-left = 1
module-margin-right = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:size=8

modules-left = bspwm cava
modules-right = tray xkeyboard bluetooth backlight pulseaudio xkeyboard battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = false
wm-restack = bspwm
; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/bspwm]
type = internal/bspwm

label-focused = "[%name%]"
label-focused-background = #abb2bf
label-focused-foreground = #282c32

label-occupied = " %name% "
label-empty = " %name% "

label-mounted = %{F#e5c07b}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}
label-offset-y = 1

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "V:"
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = Mt
label-muted-foreground = ${colors.disabled}

scroll-up = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#e5c07b}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#e5c07b}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#e5c07b}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M:%S
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/bluetooth]
type = custom/script
exec = $HOME/.config/polybar/scripts/bluetooth.sh
interval = 5
click-left = blueman-manager
click-right = bluetoothctl power toggle
format-foreground = ${colors.primary}

[module/tray]
type = internal/tray

tray-size = 14

format-margin = 5

tray-spacing = 5

[module/cava]
type = custom/script
tail = true
exec = $HOME/.config/polybar/scripts/cava.sh
format = <label>
format-font = 5
label = %output%

[module/backlight]
type = custom/script
exec = printf "B: %s%%\n" "$(brightnessctl -m | cut -d, -f4 | tr -d '%')"
interval = 0.1
tail = false

scroll-up = brightnessctl set 5%+
scroll-down = brightnessctl set 5%-

click-left = brightnessctl set 100%

format = <label>
label = %output%

[module/battery]
type = custom/script
exec = $HOME/.config/polybar/scripts/battery.sh
interval = 0.1
format = <label>
label = %output%
